<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>BodyTrack</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f5f7;color:#111;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text",Arial,sans-serif}
main{max-width:720px;margin:auto;padding:20px 16px 100px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
h1{font-size:30px;margin:0;font-weight:800;letter-spacing:-.7px}h2{font-size:21px;margin:0 0 12px}h3{margin:0 0 8px}
.pill{background:#111;color:#fff;border-radius:999px;padding:7px 11px;font-size:12px;font-weight:700}
.card{background:#fff;border-radius:20px;padding:16px;margin:12px 0;box-shadow:0 2px 12px #0000000b}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{background:#f1f1f4;border-radius:15px;padding:13px}.stat span{display:block;color:#666;font-size:12px}.stat b{display:block;font-size:20px;margin-top:4px}
label{display:block;font-size:12px;font-weight:700;color:#555;margin:12px 0 6px}input,select,button{width:100%;font:inherit;border-radius:13px;padding:12px;border:1px solid #ddd;background:#fff}button{background:#111;color:#fff;border:0;font-weight:700;margin-top:10px}.secondary{background:#e9e9ed;color:#111}.danger{background:#c62828}.muted,.mini{color:#666;font-size:13px}.row{display:flex;justify-content:space-between;gap:12px;align-items:center}.hidden{display:none}
.nav{position:fixed;bottom:0;left:0;right:0;background:#ffffffee;backdrop-filter:blur(14px);border-top:1px solid #ddd;display:flex;justify-content:center;gap:6px;padding:10px max(10px,calc((100vw - 720px)/2));padding-bottom:calc(10px + env(safe-area-inset-bottom));z-index:5}
.nav button{margin:0;background:transparent;color:#666;padding:10px 12px}.nav button.active{background:#111;color:#fff}
.record{background:#f7f7f9;border:1px solid #e5e5e8;border-radius:17px;padding:15px;margin-top:10px}
.recordHead{display:flex;justify-content:space-between;align-items:center;gap:10px}.date{font-size:17px;font-weight:800}.delete{width:auto;margin:0;background:#ececef;color:#b00020;padding:8px 10px;font-size:12px}
.recordLine{display:flex;justify-content:space-between;padding-top:10px;margin-top:10px;border-top:1px solid #e5e5e8}.recordLine span{color:#666;font-size:13px}.recordLine b{font-size:15px}
.good{color:#16803c}.surplus{color:#b00020}.empty{text-align:center;padding:24px 8px;color:#777}
.total{font-size:30px;font-weight:850;letter-spacing:-.5px}.smallTitle{font-size:12px;color:#666;text-transform:uppercase;letter-spacing:.5px;font-weight:700}
</style>
</head>
<body>
<main>
  <div class="top"><h1>BodyTrack</h1><div id="modePill" class="pill">Cut</div></div>

  <section id="today">
    <div class="card">
      <h2>Today</h2>
      <div class="grid">
        <div><label>Date</label><input id="date" type="date"></div>
        <div><label>Weight (kg)</label><input id="weight" type="number" step="0.01" inputmode="decimal"></div>
        <div><label>Calories</label><input id="calories" type="number" inputmode="numeric"></div>
        <div><label>Protein (g)</label><input id="protein" type="number" inputmode="numeric"></div>
        <div><label>Carbs (g)</label><input id="carbs" type="number" inputmode="numeric"></div>
        <div><label>Fat (g)</label><input id="fat" type="number" inputmode="numeric"></div>
        <div><label>Steps</label><input id="steps" type="number" inputmode="numeric"></div>
        <div><label>Treadmill (min)</label><input id="treadmill" type="number" inputmode="numeric"></div>
      </div>
      <button onclick="saveToday()">Save / Update Day</button>
    </div>

    <div class="card">
      <h2>Today</h2>
      <div class="grid">
        <div class="stat"><span>Weight</span><b id="sWeight">—</b></div>
        <div class="stat"><span>Calories</span><b id="sCal">—</b></div>
        <div class="stat"><span>Protein</span><b id="sProtein">—</b></div>
        <div class="stat"><span>Deficit</span><b id="sDef">—</b></div>
      </div>
    </div>
  </section>

  <section id="records" class="hidden">
    <div class="card">
      <div class="smallTitle">All saved deficit records</div>
      <div class="total" id="recordTotal">0 kcal</div>
      <div class="muted" id="recordCount">0 recorded days</div>
    </div>
    <div class="card">
      <h2>Records</h2>
      <div class="muted">Every saved day stays here until you manually delete it.</div>
      <div id="recordsList"></div>
    </div>
  </section>

  <section id="history" class="hidden">
    <div class="card"><h2>History</h2><div class="muted">Full daily nutrition and activity history.</div><div id="historyList"></div></div>
  </section>

  <section id="more" class="hidden">
    <div class="card">
      <h2>Settings</h2>
      <label>Maintenance / burn target (kcal)</label>
      <input id="maintenance" type="number" inputmode="numeric" placeholder="e.g. 2150">
      <button onclick="saveSettings()">Save burn target</button>
      <label>Mode</label>
      <select id="mode" onchange="state.mode=this.value;save();renderAll()">
        <option value="cut">Cut / Weight Loss</option><option value="maintain">Maintenance</option>
      </select>
      <button class="secondary" onclick="exportData()">Export backup</button>
      <label>Restore backup</label><input type="file" accept=".json" onchange="importData(event)">
      <button class="danger" onclick="resetAll()">Delete ALL BodyTrack data</button>
    </div>
  </section>
</main>

<nav class="nav">
  <button class="active" onclick="show('today',this)">Today</button>
  <button onclick="show('records',this)">Records</button>
  <button onclick="show('history',this)">History</button>
  <button onclick="show('more',this)">More</button>
</nav>

<script>
const KEY='bodyTrack_v5_records';
let state=JSON.parse(localStorage.getItem(KEY)||'null')||{
  mode:'cut', maintenanceTarget:2150, records:{}
};

function save(){localStorage.setItem(KEY,JSON.stringify(state))}
function pad(n){return String(n).padStart(2,'0')}
function today(){const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function fmt(n,d=2){return n==null?'—':Number(n).toFixed(d)}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}

function deficit(r){
  if(state.maintenanceTarget==null || r.calories==null || r.calories==='') return null;
  return Number(state.maintenanceTarget)-Number(r.calories);
}

function loadDay(date){
  const r=state.records[date]||{};
  document.getElementById('date').value=date;
  ['weight','calories','protein','carbs','fat','steps','treadmill'].forEach(k=>document.getElementById(k).value=r[k]??'');
  renderToday(r);
}
document.getElementById('date').addEventListener('change',e=>loadDay(e.target.value));

function renderToday(r){
  document.getElementById('sWeight').textContent=r.weight==null?'—':fmt(r.weight)+' kg';
  document.getElementById('sCal').textContent=r.calories==null?'—':r.calories;
  document.getElementById('sProtein').textContent=r.protein==null?'—':r.protein+' g';
  const d=deficit(r);
  const el=document.getElementById('sDef');
  el.textContent=d==null?'—':(d>=0?Math.round(d)+' kcal':'+'+Math.round(Math.abs(d))+' kcal surplus');
  el.className=d==null?'':(d>=0?'good':'surplus');
}

function saveToday(){
  const date=document.getElementById('date').value||today();
  const r={};
  ['weight','calories','protein','carbs','fat','steps','treadmill'].forEach(k=>{
    const v=document.getElementById(k).value;
    if(v!=='') r[k]=Number(v);
  });
  r.updatedAt=new Date().toISOString();
  state.records[date]=r;
  save(); renderAll();
  alert('Saved '+date);
}

function renderRecords(){
  const arr=Object.entries(state.records).map(([date,r])=>({date,r,d:deficit(r)}))
    .filter(x=>x.d!=null).sort((a,b)=>b.date.localeCompare(a.date));
  const total=arr.reduce((s,x)=>s+x.d,0);
  document.getElementById('recordTotal').textContent=(total>=0?'':'-')+Math.round(Math.abs(total)).toLocaleString()+' kcal';
  document.getElementById('recordCount').textContent=arr.length+' recorded day'+(arr.length===1?'':'s');

  document.getElementById('recordsList').innerHTML=arr.length?arr.map(x=>`
    <div class="record">
      <div class="recordHead">
        <div class="date">${new Date(x.date+'T12:00:00').toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric',year:'numeric'})}</div>
        <button class="delete" onclick="deleteRecord('${x.date}')">Delete</button>
      </div>
      <div class="recordLine"><span>Weight</span><b>${x.r.weight==null?'—':fmt(x.r.weight)+' kg'}</b></div>
      <div class="recordLine"><span>Deficit</span><b class="${x.d>=0?'good':'surplus'}">${x.d>=0?Math.round(x.d)+' kcal deficit':Math.round(Math.abs(x.d))+' kcal surplus'}</b></div>
    </div>`).join(''):'<div class="empty">No deficit records yet.<br>Save a day with calories and a burn target.</div>';
}

function deleteRecord(date){
  if(confirm('Delete the record for '+date+'?')){
    delete state.records[date]; save(); renderAll();
  }
}

function renderHistory(){
  const arr=Object.entries(state.records).sort((a,b)=>b[0].localeCompare(a[0]));
  document.getElementById('historyList').innerHTML=arr.length?arr.map(([date,r])=>{
    const d=deficit(r);
    return `<div class="record"><div class="date">${date}</div>
      <div class="recordLine"><span>Weight</span><b>${r.weight==null?'—':fmt(r.weight)+' kg'}</b></div>
      <div class="recordLine"><span>Calories</span><b>${r.calories??'—'}</b></div>
      <div class="recordLine"><span>Protein</span><b>${r.protein==null?'—':r.protein+' g'}</b></div>
      <div class="recordLine"><span>Deficit</span><b>${d==null?'—':(d>=0?Math.round(d)+' kcal deficit':Math.round(Math.abs(d))+' kcal surplus')}</b></div>
    </div>`}).join(''):'<div class="empty">No saved days.</div>';
}

function saveSettings(){
  const v=document.getElementById('maintenance').value;
  state.maintenanceTarget=v===''?null:Number(v); save(); renderAll(); alert('Burn target saved');
}
function exportData(){
  const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='BodyTrack-backup.json';a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),500);
}
function importData(ev){
  const f=ev.target.files[0];if(!f)return;
  const rd=new FileReader();rd.onload=()=>{try{
    const x=JSON.parse(rd.result);if(!x.records)throw 0;state=x;save();location.reload();
  }catch(e){alert('Invalid BodyTrack backup')}};rd.readAsText(f);
}
function resetAll(){
  if(confirm('Delete ALL BodyTrack data?')){localStorage.removeItem(KEY);location.reload()}
}
function show(id,btn){
  ['today','records','history','more'].forEach(x=>document.getElementById(x).classList.toggle('hidden',x!==id));
  document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));btn.classList.add('active');
  if(id==='records')renderRecords();if(id==='history')renderHistory();
}
function renderAll(){
  document.getElementById('maintenance').value=state.maintenanceTarget??'';
  document.getElementById('mode').value=state.mode||'cut';
  document.getElementById('modePill').textContent=state.mode==='maintain'?'Maintenance':'Cut';
  const d=document.getElementById('date').value||today();loadDay(d);renderRecords();renderHistory();
}
document.getElementById('date').value=today();renderAll();
</script>
</body>
</html>
